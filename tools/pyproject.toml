[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nustack-docsgen"
version = "0.1.0"
description = "Generates the reference docs from nu.inspect."
requires-python = ">=3.11"
dependencies = [
    "nucore==0.6.3",
    "nustd[all]==0.6.3",
    "nuspace==0.5.3",
    "nuverse==0.3.2",
]

[project.scripts]
docsgen = "docsgen.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["docsgen"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Builds sites/nustack.dev as a static export and pushes it to the gh-pages branch
# of nustackdev/nustack.dev, which serves it on GitHub Pages at nustack.dev.
# Runs on push to main (when the site, the shared kit or deps change) and via
# manual dispatch from the Actions tab.
#
# Prereqs (one-time):
#   nustackdev/nustack.dev -> Settings -> Deploy keys: public key, write access
#   nustackdev/www   -> Settings -> Secrets -> Actions: NUSTACK_DEV_DEPLOY_KEY = private key
#   nustackdev/nustack.dev -> Settings -> Pages: deploy from branch gh-pages, / (root),
#                       custom domain nustack.dev
name: Deploy nustack.dev

on:
  push:
    branches: [main]
    paths:
      - sites/nustack.dev/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy-nustack.dev.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-nustack.dev
  cancel-in-progress: true

jobs:
  deploy:
    name: build + deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: install
        run: pnpm install --frozen-lockfile --filter nustack.dev...

      - name: build (static export)
        run: pnpm --filter nustack.dev build

      - name: push to nustackdev/nustack.dev
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.NUSTACK_DEV_DEPLOY_KEY }}
          external_repository: nustackdev/nustack.dev
          publish_branch: gh-pages
          publish_dir: sites/nustack.dev/out
          cname: nustack.dev
          force_orphan: true
          commit_message: deploy ${{ github.sha }}

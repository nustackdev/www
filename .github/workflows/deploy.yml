# Builds every zone app (landing, docs, blog), composes them into one static
# site and publishes it with GitHub Pages straight from this repo, at
# nustack.dev. Runs on push to main and via manual dispatch.
#
# Prereqs (one-time):
#   nustackdev/www -> Settings -> Pages: Source "GitHub Actions",
#                     custom domain nustack.dev (remove it from the old
#                     nustackdev/nustack.dev Pages repo first)
name: Deploy nustack.dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build + compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: install
        run: pnpm install --frozen-lockfile

      - name: build apps + compose site
        run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
